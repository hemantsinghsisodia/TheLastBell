; The Last Bell: the game starts in TRUE fullscreen at the desktop resolution on first launch (owner, P18-4).
; A saved Saved/Config/<platform>/GameUserSettings.ini overrides every key here, so the player's own choices win.
; Version must equal the engine's UE_GAMEUSERSETTINGS_VERSION (5), or the engine ignores these values when it creates the window.
; ResolutionSizeX/Y 0 with bUseDesktopResolution makes the first window the monitor's native size (not a tiny default).
[/Script/Engine.GameUserSettings]
Version=5
bUseDesktopResolution=True
ResolutionSizeX=0
ResolutionSizeY=0
LastUserConfirmedResolutionSizeX=0
LastUserConfirmedResolutionSizeY=0
FullscreenMode=0
LastConfirmedFullscreenMode=0
PreferredFullscreenMode=0
