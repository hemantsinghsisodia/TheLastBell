; The Last Bell scalability overrides (P7-FIX2 P7F-7, D-054).
; Volumetric fog: Epic/Cinematic use the High grid (16 px, 64 slices). The engine default at Epic
; (8 px, 128 slices) cost 6.2 ms on the RTX 4050 dev floor; the fog look is soft enough that the
; coarser grid is not visible.
[ShadowQuality@3]
r.VolumetricFog.GridPixelSize=16
r.VolumetricFog.GridSizeZ=64

[ShadowQuality@Cine]
r.VolumetricFog.GridPixelSize=16
r.VolumetricFog.GridSizeZ=64
r.VolumetricFog.HistoryMissSupersampleCount=4
